name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: tests on a host without an IPv6 stack
        run: ./scripts/test-without-ipv6.sh

  linux-release:
    name: release x86_64-unknown-linux-musl
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p st-server --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/st-server
            deploy/
          if-no-files-found: error

  windows-release:
    name: test + release x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # st-server is Linux-only.
      - run: cargo test --workspace --exclude st-server
      - run: cargo build --release --workspace --exclude st-server
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          path: |
            target/release/st-client.exe
          if-no-files-found: ignore
