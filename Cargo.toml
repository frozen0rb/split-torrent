[workspace]
resolver = "2"
members = ["crates/st-protocol", "crates/st-server", "crates/st-client-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frozen0rb/split-torrent"

[workspace.dependencies]
st-protocol = { path = "crates/st-protocol" }
st-server = { path = "crates/st-server" }
st-client-core = { path = "crates/st-client-core" }
anyhow = "1"
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
